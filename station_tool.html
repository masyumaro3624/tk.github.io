<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>駅座標取得ツール</title>
<style>

html, body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: #111;
  color: white;
  font-family: sans-serif;
}

/* ✅ スクロールラッパーを追加 */
#viewer {
  width: 100vw;
  height: 100vh;
  overflow: auto;
  -webkit-overflow-scrolling: touch;
}

#map {
  position: relative;
  width: 1500px;
  height: 27000px;

  transform: scale(0.5);
  transform-origin: top left;
}

#bg {
  position: absolute;
  left: 0; /* ✅ px を追加 */
  top: 0;
  width: 1500px;
  height: 27000px;
}

.station {
  position: absolute;
  width: 24px;
  height: 24px;
  background: red;
  border-radius: 50%;
  transform: translate(-50%, -50%);
  pointer-events: none;
}

.label {
  position: absolute;
  top: -28px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,0.7);
  color: white;
  font-size: 20px;
  padding: 2px 6px;
  border-radius: 4px;
  white-space: nowrap;
}

/* ✅ 固定パネル */
#panel {
  position: fixed;
  right: 20px;
  top: 20px;
  background: #222;
  padding: 16px;
  border-radius: 12px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  z-index: 9999;
  width: 280px;
}

#panel h3 {
  margin: 0 0 10px;
  font-size: 16px;
}

textarea {
  width: 100%;
  height: 320px;
  background: #333;
  color: #0f0;
  border: none;
  border-radius: 6px;
  padding: 8px;
  font-size: 12px;
  font-family: monospace;
  box-sizing: border-box;
  resize: none;
}

.btn-row {
  display: flex;
  gap: 8px;
  margin-top: 10px;
}

button {
  flex: 1;
  padding: 8px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-size: 13px;
  font-weight: bold;
}

#copyBtn  { background: #4caf50; color: white; }
#undoBtn  { background: #f44336; color: white; }

#counter {
  margin-top: 8px;
  font-size: 13px;
  color: #aaa;
  text-align: center;
}

</style>
</head>
<body>

<!-- ✅ スクロールラッパー -->
<div id="viewer">
  <div id="map">
    <img src="background.png" id="bg">
  </div>
</div>

<!-- ✅ 固定パネル -->
<div id="panel">
  <h3>🚉 駅座標取得ツール</h3>
  <textarea id="output" readonly placeholder="路線図をクリックすると座標が出力されます"></textarea>
  <div class="btn-row">
    <button id="copyBtn" onclick="copyOutput()">📋 コピー</button>
    <button id="undoBtn" onclick="undoLast()">↩ 1個戻す</button>
  </div>
  <div id="counter">クリック数: <span id="clickCount">0</span> / 43</div>
</div>

<script src="tool.js"></script>

</body>
</html>
